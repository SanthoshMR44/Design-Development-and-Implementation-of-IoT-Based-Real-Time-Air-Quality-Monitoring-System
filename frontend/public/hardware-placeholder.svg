<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" style="background:#0a1628">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#0f2040"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)" rx="16"/>
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#06b6d440" stroke-width="1" rx="12"/>
  <!-- RDL838 Industrial Data Logger outline -->
  <rect x="300" y="60" width="280" height="180" rx="8" fill="#1a2840" stroke="#06b6d460" stroke-width="1.5"/>
  <text x="440" y="120" text-anchor="middle" fill="#06b6d4" font-family="monospace" font-size="13" font-weight="bold">RDL838</text>
  <text x="440" y="140" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">INDUSTRIAL DATA LOGGER</text>
  <text x="440" y="158" text-anchor="middle" fill="#475569" font-family="monospace" font-size="9">Smart Analytic Tool</text>
  <!-- LEDs -->
  <circle cx="395" cy="210" r="5" fill="#22c55e" opacity="0.8"/>
  <circle cx="415" cy="210" r="5" fill="#06b6d4" opacity="0.8"/>
  <circle cx="435" cy="210" r="5" fill="#f59e0b" opacity="0.4"/>
  <circle cx="455" cy="210" r="5" fill="#ef4444" opacity="0.3"/>
  <!-- XY-MD02 sensor -->
  <rect x="180" y="100" width="100" height="80" rx="6" fill="#1e2d40" stroke="#2dd4bf50" stroke-width="1.5"/>
  <text x="230" y="140" text-anchor="middle" fill="#2dd4bf" font-family="monospace" font-size="10" font-weight="bold">XY-MD02</text>
  <text x="230" y="158" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="8">Temp/Humidity</text>
  <!-- RDL Junction Box -->
  <rect x="100" y="280" width="120" height="100" rx="8" fill="#162030" stroke="#06b6d440" stroke-width="1.5"/>
  <text x="160" y="335" text-anchor="middle" fill="#475569" font-family="monospace" font-size="9">RDL</text>
  <text x="160" y="350" text-anchor="middle" fill="#475569" font-family="monospace" font-size="8">Junction Box</text>
  <!-- Mornsun PSU -->
  <rect x="620" y="80" width="120" height="160" rx="6" fill="#1a2535" stroke="#f59e0b40" stroke-width="1.5"/>
  <text x="680" y="165" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="10" font-weight="bold">MORNSUN</text>
  <text x="680" y="182" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="8">Power Supply</text>
  <!-- Antenna -->
  <line x1="530" y1="30" x2="530" y2="70" stroke="#06b6d480" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="530" cy="28" rx="8" ry="4" fill="#0a1628" stroke="#06b6d4" stroke-width="1.5"/>
  <!-- Wiring -->
  <path d="M 280 150 Q 260 150 250 150" stroke="#ef444460" stroke-width="2" fill="none"/>
  <path d="M 300 200 Q 280 250 260 300" stroke="#22c55e40" stroke-width="1.5" fill="none"/>
  <path d="M 580 180 Q 610 180 620 160" stroke="#f59e0b40" stroke-width="2" fill="none"/>
  <!-- Label -->
  <rect x="200" y="420" width="400" height="40" rx="8" fill="#06b6d410" stroke="#06b6d430" stroke-width="1"/>
  <text x="400" y="444" text-anchor="middle" fill="#06b6d4" font-family="monospace" font-size="11" font-weight="bold">AQMS HARDWARE PROTOTYPE</text>
</svg>
